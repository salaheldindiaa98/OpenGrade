<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b7f6f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OpenGrade — free bubble sheet grader</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14202b;--mute:#5d6b78;--line:#dde3e9;--accent:#0b7f6f;--accent-ink:#fff;--ok:#12a36a;--warn:#c77700;--bad:#d23c3c;--chip:#eef2f5;--shadow:0 1px 2px rgba(20,32,43,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#e8eef3;--mute:#93a2af;--line:#2a3743;--accent:#2fbfa9;--accent-ink:#06211c;--ok:#3ccb8f;--warn:#f0a63a;--bad:#ff7070;--chip:#223039;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.page{min-height:100vh;min-height:100dvh}.page.withnav{padding-bottom:72px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-size:1.15rem}.logo{color:var(--accent);font-size:1.4rem}.sub{color:var(--mute);margin-left:auto;font-size:.85rem}
.pad{padding:14px;max-width:760px;margin:0 auto}.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center}.gap{gap:10px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.card h3{margin:0}.card.row{gap:10px}.cards{display:flex;flex-direction:column;gap:10px;margin-top:14px}
h4{margin:6px 0 0;color:var(--mute);font-weight:600}
.muted{color:var(--mute)}.small{font-size:.85rem}.center{text-align:center}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em}
.hidden{display:none!important}.click{cursor:pointer}.chev{color:var(--mute);font-size:1.4rem}
.btn{border:1px solid var(--line);background:var(--card);padding:11px 16px;border-radius:12px;font-weight:600;cursor:pointer;min-height:46px}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.big{width:100%;font-size:1.1rem;min-height:54px}
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.sm{padding:7px 12px;min-height:38px;font-size:.92rem}
.btn.good.sel{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.bad.sel{background:var(--bad);color:#fff;border-color:var(--bad)}
.icon{border:0;background:transparent;font-size:1.35rem;width:42px;height:42px;border-radius:10px;cursor:pointer}.icon.sm{width:34px;height:34px;font-size:1rem;color:var(--mute)}
.field{display:flex;flex-direction:column;gap:4px}.field>span{font-weight:600;font-size:.92rem}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:46px}
textarea{resize:vertical}input:disabled,select:disabled{opacity:.55}
.warn{background:rgba(199,119,0,.12);border:1px solid var(--warn);color:var(--ink);padding:10px 12px;border-radius:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--chip);font-size:.8rem;font-weight:600;white-space:nowrap}.pill.ok{background:rgba(18,163,106,.16);color:var(--ok)}.pill.warn{background:rgba(199,119,0,.16);color:var(--warn);border:0}
.ok-text{color:var(--ok);font-weight:600}.bad-text{color:var(--bad);font-weight:600}.warn-text{color:var(--warn);font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:transparent;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.78rem;color:var(--mute);position:relative;cursor:pointer}
.nav button.on{color:var(--accent);font-weight:700}.ni{font-size:1.25rem}
.badge{position:absolute;top:3px;left:calc(50% + 8px);background:var(--warn);color:#fff;border-radius:99px;font-size:.7rem;font-style:normal;padding:0 6px;min-width:18px;text-align:center;display:none}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 14px}
.krow{display:flex;align-items:center;gap:5px}.qn{width:2.2em;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:9px;min-width:38px;height:38px;font-weight:700;cursor:pointer;padding:0 6px}
.chip.small{font-size:.75rem;font-weight:600;color:var(--mute)}.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.big{min-width:54px;height:50px;font-size:1.1rem}.chip.marked{border:2px solid var(--ink)}.chip.iskey{box-shadow:inset 0 -4px 0 var(--ok)}
.preview{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;max-height:420px;display:flex;justify-content:center}.preview svg{max-height:420px;width:auto;height:auto;max-width:100%}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.srow,.rrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);min-height:52px}.srow:last-child,.rrow:last-child{border-bottom:0}
.srow.absent .sname,.rrow.dim{opacity:.5}.serial{min-width:2.3em;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}.sname{overflow:hidden;text-overflow:ellipsis}.score{font-variant-numeric:tabular-nums}
.switch{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.85rem;color:var(--mute);white-space:nowrap}.switch.wide{font-size:1rem;color:var(--ink);white-space:normal;align-items:flex-start}
.switch input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column}.stat b{font-size:1.5rem}.stat span{color:var(--mute);font-size:.82rem}.stat.warn b{color:var(--warn)}
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.ovhead{padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}.ovbody{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px;max-width:760px;width:100%;margin:0 auto}
.ovfoot{padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}.bigscore{font-size:1.4rem}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px;font-weight:600;cursor:pointer;color:var(--mute)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}.qcard.flag{border-color:var(--warn);border-width:2px}
.qno{font-size:1.2rem;min-width:2.6em}.chips{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:.78rem;font-weight:700;border-radius:8px;padding:2px 8px;background:var(--chip)}.t-blank{background:rgba(199,119,0,.18);color:var(--warn)}.t-multi{background:rgba(210,60,60,.16);color:var(--bad)}.t-unsure{background:rgba(199,119,0,.18);color:var(--warn)}.t-set{background:rgba(11,127,111,.15);color:var(--accent)}
.crop{width:100%;max-width:440px;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;align-self:flex-start;image-rendering:auto}
.camwrap{position:relative;width:100%;aspect-ratio:3/4;max-height:68vh;background:#000;border-radius:14px;overflow:hidden;margin:0 auto}
.camwrap video,.ovcanvas{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.camwrap.flash{outline:6px solid var(--ok);outline-offset:-6px}
.cammsg{position:absolute;left:8px;right:8px;bottom:8px;padding:9px 12px;border-radius:10px;font-weight:600;font-size:.92rem;background:rgba(0,0,0,.66);color:#fff}
.cammsg.ok{background:rgba(18,140,92,.92)}.cammsg.warn{background:rgba(190,110,0,.94)}.cammsg.bad{background:rgba(190,45,45,.94)}
.keybanner{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#14202b;color:#fff;padding:11px 16px;border-radius:12px;max-width:92vw;opacity:0;pointer-events:none;transition:.22s;z-index:50;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}#toast.show{opacity:1;transform:translate(-50%,0)}

</style>
</head>
<body>
<div id="app"></div>
<script id="coreScript">
/* OpenGrade core engine — no dependencies.
   Sheet layout, printable SVG, corner-marker detection, perspective mapping,
   bubble reading, classification, and a synthetic-photo generator for self-tests. */
const OGCore = (function () {
'use strict';

const LETTERS = 'ABCDEFGH';
const TH = { mark: 0.30, faint: 0.14 };   // darkness thresholds (0..1)

/* ------------------------------------------------------------------ layout */
function pageSize(paper) { return paper === 'Letter' ? { w: 215.9, h: 279.4 } : { w: 210, h: 297 }; }

function makeLayout(cfg) {
  const n = +cfg.n, k = +cfg.k;
  if (!(n >= 1 && n <= 100)) throw new Error('Questions must be between 1 and 100');
  if (!(k >= 2 && k <= 6)) throw new Error('Choices must be between 2 and 6');
  const paper = cfg.paper === 'Letter' ? 'Letter' : 'A4';
  const P = pageSize(paper);
  const MI = 12;                                   // marker centre inset from page edge (mm)
  const markers = [                                // order: TL (big anchor), TR, BR, BL
    { cx: MI, cy: MI, s: 11, anchor: true },
    { cx: P.w - MI, cy: MI, s: 7 },
    { cx: P.w - MI, cy: P.h - MI, s: 7 },
    { cx: MI, cy: P.h - MI, s: 7 }
  ];
  const gridTop = 80, gridBottom = P.h - 24, topLabelH = 9;
  const labelW = 8, gapMin = 5, availW = P.w - 28;
  const availH = gridBottom - gridTop - topLabelH;
  let cols, R, p;
  for (const minPitch of [7, 6.4]) {
    const maxRows = Math.floor(availH / minPitch);
    cols = Math.ceil(n / maxRows); R = Math.ceil(n / cols);
    p = Math.min(7, (availW - (cols - 1) * gapMin - cols * labelW) / (cols * k));
    if (p >= 5.4) break;
  }
  if (p < 5.4) throw new Error('Too many questions or choices for one sheet');
  const r = Math.min(2.5, (p - 1.4) / 2);
  const rowPitch = Math.min(9, availH / R);
  const colW = labelW + k * p;
  const gap = cols > 1 ? Math.min(12, (availW - cols * colW) / (cols - 1)) : 0;
  const startX = (P.w - (cols * colW + (cols - 1) * gap)) / 2;
  const questions = [];
  for (let q = 0; q < n; q++) {
    const col = Math.floor(q / R), row = q % R;
    const x0 = startX + col * (colW + gap);
    const cy = gridTop + topLabelH + rowPitch * (row + 0.5);
    const bubbles = [];
    for (let j = 0; j < k; j++) bubbles.push({ cx: x0 + labelW + p * (j + 0.5), cy });
    questions.push({ q, col, row, bubbles, labelX: x0 + labelW - 1.5, labelY: cy,
      box: { x: x0, y: cy - rowPitch / 2, w: colW, h: rowPitch } });
  }
  return { n, k, paper, P, markers, r, rowPitch, colW, cols, R, p, gridTop, topLabelH, startX, gap, labelW,
           questions, title: cfg.title || '', subtitle: cfg.subtitle || '' };
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function sheetSVG(L) {
  const P = L.P, o = [];
  const T = (x, y, size, txt, extra) => o.push(`<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" font-size="${size}" ${extra || ''}>${esc(txt)}</text>`);
  const Ln = (x1, y1, x2, y2, sw) => o.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" stroke-width="${sw || 0.3}"/>`);
  o.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${P.w} ${P.h}" width="${P.w}mm" height="${P.h}mm" font-family="Arial, Helvetica, sans-serif">`);
  o.push(`<rect width="${P.w}" height="${P.h}" fill="#fff"/>`);
  for (const m of L.markers) o.push(`<rect x="${(m.cx - m.s / 2).toFixed(2)}" y="${(m.cy - m.s / 2).toFixed(2)}" width="${m.s}" height="${m.s}" fill="#000"/>`);
  T(P.w / 2, 28, 6.5, L.title || 'Answer Sheet', 'text-anchor="middle" font-weight="bold"');
  if (L.subtitle) T(P.w / 2, 34.5, 3.6, L.subtitle, 'text-anchor="middle" fill="#444"');
  T(20, 46, 3.8, 'Name:'); Ln(33, 46.6, P.w - 74, 46.6);
  T(P.w - 68, 46, 3.8, 'Serial:'); Ln(P.w - 54, 46.6, P.w - 20, 46.6);
  T(20, 58, 3.8, 'Date:'); Ln(32, 58.6, 90, 58.6);
  o.push(`<rect x="${P.w - 60}" y="51" width="40" height="15" fill="none" stroke="#000" stroke-width="0.3"/>`);
  T(P.w - 40, 55.6, 2.8, 'Score', 'text-anchor="middle" fill="#444"');
  T(P.w - 36, 63.6, 4.2, '/ ' + L.n, 'text-anchor="middle"');
  T(20, 72, 2.9, 'Fill each bubble completely with a dark pen or pencil. One answer per question. Do not write inside the grid.', 'fill="#444"');
  const letters = LETTERS.slice(0, L.k);
  for (let c = 0; c < L.cols; c++) {
    const q0 = c * L.R; if (q0 >= L.n) break;
    const first = L.questions[q0];
    for (let j = 0; j < L.k; j++) T(first.bubbles[j].cx, L.gridTop + 5.2, 3.2, letters[j], 'text-anchor="middle"');
  }
  for (const Q of L.questions) {
    T(Q.labelX, Q.labelY + 1.25, 3.5, String(Q.q + 1), 'text-anchor="end"');
    for (const b of Q.bubbles) o.push(`<circle cx="${b.cx.toFixed(2)}" cy="${b.cy.toFixed(2)}" r="${L.r}" fill="none" stroke="#000" stroke-width="0.35"/>`);
  }
  T(P.w / 2, P.h - 7, 2.6, `OpenGrade  |  ${L.n} questions  |  ${L.k} choices  |  ${L.paper}`, 'text-anchor="middle" fill="#888"');
  o.push('</svg>');
  return o.join('');
}

/* ------------------------------------------------------------------ vision */
function toGray(rgba, n) {
  const g = new Uint8Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) g[i] = (rgba[j] * 77 + rgba[j + 1] * 150 + rgba[j + 2] * 29) >> 8;
  return g;
}

function downscale(g, w, h, maxSide) {
  const f = Math.max(1, Math.round(Math.max(w, h) / maxSide));
  if (f === 1) return { g, w, h, f: 1 };
  const nw = Math.floor(w / f), nh = Math.floor(h / f), o = new Uint8Array(nw * nh), a = f * f;
  for (let y = 0; y < nh; y++) for (let x = 0; x < nw; x++) {
    let s = 0;
    for (let yy = 0; yy < f; yy++) { const idx = (y * f + yy) * w + x * f; for (let xx = 0; xx < f; xx++) s += g[idx + xx]; }
    o[y * nw + x] = (s / a + 0.5) | 0;
  }
  return { g: o, w: nw, h: nh, f };
}

function adaptiveDark(g, w, h, half, C) {
  const W1 = w + 1, I = new Uint32Array(W1 * (h + 1));
  for (let y = 0; y < h; y++) {
    let row = 0;
    for (let x = 0; x < w; x++) { row += g[y * w + x]; I[(y + 1) * W1 + x + 1] = I[y * W1 + x + 1] + row; }
  }
  const out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    const y0 = Math.max(0, y - half), y1 = Math.min(h, y + half + 1);
    for (let x = 0; x < w; x++) {
      const x0 = Math.max(0, x - half), x1 = Math.min(w, x + half + 1);
      const s = I[y1 * W1 + x1] - I[y0 * W1 + x1] - I[y1 * W1 + x0] + I[y0 * W1 + x0];
      const cnt = (x1 - x0) * (y1 - y0);
      if (g[y * w + x] * cnt < s - C * cnt) out[y * w + x] = 1;
    }
  }
  return out;
}

function components(bin, w, h, minA, maxA) {
  const vis = new Uint8Array(w * h), q = new Int32Array(w * h), out = [];
  for (let s = 0; s < w * h; s++) {
    if (!bin[s] || vis[s]) continue;
    let head = 0, tail = 0, sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0, bx0 = w, bx1 = 0, by0 = h, by1 = 0;
    q[tail++] = s; vis[s] = 1;
    while (head < tail) {
      const p = q[head++], y = (p / w) | 0, x = p - y * w;
      sx += x; sy += y; sxx += x * x; syy += y * y; sxy += x * y;
      if (x < bx0) bx0 = x; if (x > bx1) bx1 = x; if (y < by0) by0 = y; if (y > by1) by1 = y;
      if (x > 0 && bin[p - 1] && !vis[p - 1]) { vis[p - 1] = 1; q[tail++] = p - 1; }
      if (x < w - 1 && bin[p + 1] && !vis[p + 1]) { vis[p + 1] = 1; q[tail++] = p + 1; }
      if (y > 0 && bin[p - w] && !vis[p - w]) { vis[p - w] = 1; q[tail++] = p - w; }
      if (y < h - 1 && bin[p + w] && !vis[p + w]) { vis[p + w] = 1; q[tail++] = p + w; }
    }
    const A = tail;
    if (A < minA || A > maxA) continue;
    const cx = sx / A, cy = sy / A;
    const mxx = sxx / A - cx * cx, myy = syy / A - cy * cy, mxy = sxy / A - cx * cy;
    let md = 0;
    for (let i = 0; i < tail; i++) {
      const p = q[i], y = (p / w) | 0, x = p - y * w, dx = x - cx, dy = y - cy, d = dx * dx + dy * dy;
      if (d > md) md = d;
    }
    const tr = mxx + myy, det = mxx * myy - mxy * mxy, disc = Math.sqrt(Math.max(0, tr * tr / 4 - det));
    const l1 = tr / 2 + disc, l2 = tr / 2 - disc;
    out.push({ cx, cy, area: A, bx0, bx1, by0, by1, ratio: (Math.sqrt(md) + 0.5) / Math.sqrt(A), elong: Math.sqrt(Math.max(0, l2) / Math.max(1e-9, l1)) });
  }
  return out;
}

function pickQuad(cands, L) {
  const m = L.markers, ar = (m[1].cx - m[0].cx) / (m[3].cy - m[0].cy), src = m.map(q => [q.cx, q.cy]);
  cands.sort((a, b) => b.area - a.area);
  const c = cands.slice(0, 16);
  const found = [];
  for (let a = 0; a < c.length; a++) for (let b = a + 1; b < c.length; b++)
  for (let d = b + 1; d < c.length; d++) for (let e = d + 1; e < c.length; e++) {
    const four = [c[a], c[b], c[d], c[e]];
    const gx = (four[0].cx + four[1].cx + four[2].cx + four[3].cx) / 4, gy = (four[0].cy + four[1].cy + four[2].cy + four[3].cy) / 4;
    const ring = four.slice().sort((p, q) => Math.atan2(p.cy - gy, p.cx - gx) - Math.atan2(q.cy - gy, q.cx - gx));   // clockwise on screen
    let sign = 0, ok = true;
    for (let i = 0; i < 4; i++) {
      const p0 = ring[i], p1 = ring[(i + 1) % 4], p2 = ring[(i + 2) % 4];
      const cr = (p1.cx - p0.cx) * (p2.cy - p1.cy) - (p1.cy - p0.cy) * (p2.cx - p1.cx);
      if (Math.abs(cr) < 1e-6) { ok = false; break; }
      const sg = cr > 0 ? 1 : -1;
      if (sign === 0) sign = sg; else if (sg !== sign) { ok = false; break; }
    }
    if (!ok) continue;
    let area = 0;
    for (let i = 0; i < 4; i++) { const p0 = ring[i], p1 = ring[(i + 1) % 4]; area += p0.cx * p1.cy - p1.cx * p0.cy; }
    area = Math.abs(area) / 2;
    const dist = (p, q) => Math.hypot(p.cx - q.cx, p.cy - q.cy);
    for (let ai = 0; ai < 4; ai++) {              // try each corner as the big "anchor" (top-left of the sheet)
      const pts = [ring[ai], ring[(ai + 1) % 4], ring[(ai + 2) % 4], ring[(ai + 3) % 4]];
      const er = (dist(pts[0], pts[1]) + dist(pts[2], pts[3])) / (dist(pts[1], pts[2]) + dist(pts[3], pts[0]));
      if (er < ar * 0.7 || er > ar * 1.4) continue;
      const H = solveH(src, pts.map(p => [p.cx, p.cy]));
      if (!H) continue;
      let sum = 0;

    const p = e.papers[target.id], ps = paperScore(e, p);
    sc.recent.unshift({ rid: target.id, name: (target.serial + '. ' + target.name).trim(), score: fmt(ps.pts) + '/' + fmt(ps.outOf), flags: ps.flags.length }); sc.recent = sc.recent.slice(0, 20);
    beep(ps.flags.length ? 600 : 880); buzz(ps.flags.length ? [60, 60, 60] : 60);
    if (sc.ui.wrap) { sc.ui.wrap.classList.add('flash'); setTimeout(() => sc.ui.wrap && sc.ui.wrap.classList.remove('flash'), 350); }
    sc.waitNext = true; sc.acceptedSig = sig; sc.frames = []; sc.lostSince = 0;
    setMsg(ps.flags.length ? 'warn' : 'ok', '✓ ' + (target.name || 'Paper ' + target.serial) + ': ' + fmt(ps.pts) + '/' + fmt(ps.outOf) + (ps.flags.length ? '  —  ' + ps.flags.length + ' to review' : ''));
    updateScanUI(); drawOverlay(null);
    if (ps.flags.length && e.review === 'each' && !opts.noReview) {
      sc.paused = true; sc.busy = false;
      openPaperView(target.id, { only: 'flagged', onClose: () => { sc.paused = false; sc.inflight = false; updateScanUI(); } });
    }
  } catch (er) { console.error(er); toast('Could not save this paper: ' + (er.message || er), 4000); }
  finally { sc.busy = false; }
}

async function applyKeySheet(cls) {
  const e = S.exam; let set = 0; const bad = [];
  cls.forEach((c, q) => { if (c.s === 'ok') { e.key[q] = c.m[0]; set++; } else bad.push(q + 1); });
  await saveExam(true); beep(880); buzz(80); S.scanMode = null;
  toast('Key read: ' + set + ' of ' + e.n + ' answers.' + (bad.length ? ' Check Q' + bad.slice(0, 8).join(', ') + (bad.length > 8 ? '…' : '') + ' by hand.' : ''), 5000);
  setTab('setup');
}

/* ---------------------------------------------------------------- scan from photos */
async function scanPhotos(files) {
  const e = S.exam; if (!sc.engine) return; sc.busy = true; let ok = 0, fail = 0;
  try {
    await new Promise(r => { const t0 = Date.now(); const w = () => (sc.ready || Date.now() - t0 > 4000) ? r() : setTimeout(w, 50); w(); });
    for (const f of files) {
      setMsg('info', 'Reading photo ' + (ok + fail + 1) + ' of ' + files.length + '…');
      let bmp; try { bmp = await createImageBitmap(f, { imageOrientation: 'from-image' }); } catch (er) { try { bmp = await createImageBitmap(f); } catch (e2) { fail++; continue; } }
      const fr = grabFrame(bmp, bmp.width, bmp.height); if (bmp.close) bmp.close();
      const id = ++sc.id, m = await new Promise(res => { sc.pending[id] = res; sc.engine.send({ t: 'frame', id, w: fr.cw, h: fr.ch, buf: fr.img.data.buffer }, [fr.img.data.buffer]); });
      if (!m.ok) { fail++; toast('Photo ' + (ok + fail) + ': ' + (m.reason === 'align' ? 'sheet not recognised' : 'could not find the 4 corner squares'), 3000); continue; }
      const cls = OGCore.classifyAll(m.fills); sc.frames = [{ sig: cls.map(sigOf), cls, fills: m.fills }];
      const warp = await requestWarp(); sc.busy = false; await acceptFrames(false, true, { warp, noReview: files.length > 1 }); sc.busy = true;
      if (S.scanMode === 'key') break; ok++;
    }
  } finally { sc.busy = false; sc.waitNext = false; sc.frames = []; }
  if (S.scanMode !== 'key') { setMsg(fail ? 'warn' : 'ok', ok + ' photo(s) scanned' + (fail ? ', ' + fail + ' failed' : '') + '.'); updateScanUI(); }
}

/* ---------------------------------------------------------------- overlay */
function drawOverlay(m, cls, state) {
  const o = sc.ov, x = sc.octx; if (!o || !x) return;
  const cw = (m && m.w) || sc.cw || 640, ch = (m && m.h) || sc.ch || 480; if (o.width !== cw || o.height !== ch) { o.width = cw; o.height = ch; }
  x.clearRect(0, 0, cw, ch); if (!m || !m.ok) return;
  const e = S.exam, col = state === 'done' ? '#19c37d' : state === 'stable' ? '#19c37d' : '#ffb020', lw = Math.max(2, cw / 300);
  x.lineWidth = lw * 1.5; x.strokeStyle = col; x.beginPath(); m.pts.forEach((p, i) => i ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y)); x.closePath(); x.stroke();
  if (!m.bp || !cls) return;
  const k = e.k, bp = m.bp, sp = Math.hypot(bp[2] - bp[0], bp[3] - bp[1]), r = Math.max(2, sp * 0.3);
  x.lineCap = 'round';
  for (let q = 0; q < e.n; q++) {
    const c = cls[q], base = q * k * 2;
    if (c.s !== 'ok') {                        // coloured band behind rows that need a decision
      x.beginPath(); x.moveTo(bp[base], bp[base + 1]); x.lineTo(bp[base + (k - 1) * 2], bp[base + (k - 1) * 2 + 1]);
      x.strokeStyle = c.s === 'blank' ? 'rgba(255,176,32,.55)' : c.s === 'multi' ? 'rgba(255,70,60,.5)' : 'rgba(255,176,32,.55)'; x.lineWidth = r * 2.9; x.stroke();
    }
    for (let j = 0; j < k; j++) {
      const px = bp[base + j * 2], py = bp[base + j * 2 + 1];
      if (c.m.includes(j)) { x.beginPath(); x.arc(px, py, r, 0, 7); x.fillStyle = c.s === 'ok' ? 'rgba(25,195,125,.9)' : 'rgba(210,40,40,.9)'; x.fill(); }
    }
  }
}


/* ---------------------------------------------------------------- start */
(async function init() {
  try { await store.open(); await loadIndex(); } catch (e) { console.error(e); }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
  render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
  window.addEventListener('pagehide', () => { try { saveExam(true); } catch (e) { } });
})();
</script>
